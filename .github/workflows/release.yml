name: Build and Publish LuxRent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package and publish Windows release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}